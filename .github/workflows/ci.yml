name: Build and test

"on":
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecommerce_ci
          POSTGRES_USER: ecommerce_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_ci -d ecommerce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__ECommerce: Host=localhost;Port=5432;Database=ecommerce_ci;Username=ecommerce_ci;Password=ci-${{ github.run_id }}-${{ github.run_attempt }}
      ECOMMERCE_TEST_CONNECTION: Host=localhost;Port=5432;Database=ecommerce_ci;Username=ecommerce_ci;Password=ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and audit packages
        run: dotnet restore ECommerce.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror
      - name: Build
        run: dotnet build ECommerce.slnx --configuration Release --no-restore --warnaserror
      - name: Restore EF tools
        run: dotnet tool restore
      - name: Validate migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project ECommerce.Infrastructure --startup-project ECommerce.Api --configuration Release --no-build
      - name: Apply migrations to disposable PostgreSQL
        run: dotnet ef database update --project ECommerce.Infrastructure --startup-project ECommerce.Api --configuration Release --no-build
      - name: Run unit and PostgreSQL integration tests
        run: dotnet test ECommerce.slnx --configuration Release --no-build --logger trx --results-directory .artifacts/test-results
      - name: Build API image
        run: docker build --tag ecommerce-api:ci .
      - name: Smoke-test development container
        run: |
          trap 'docker logs ecommerce-api-ci || true; docker rm --force ecommerce-api-ci || true' EXIT
          docker run --detach --name ecommerce-api-ci --network host \
            --env ConnectionStrings__ECommerce \
            --env ASPNETCORE_ENVIRONMENT=Development ecommerce-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health/ready; then
              curl --fail --silent http://localhost:8080/api/products > /dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
